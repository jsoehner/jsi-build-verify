[project]
name = "jsi-build-verify"
version = "0.1.0"
description = "Self-contained reusable GitHub Actions build & functional verification harness"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "scripts",
    "skills/jeffs-automated-build-deploy-agent/scripts",
]
addopts = "-q"
markers = [
    "integration: tests requiring external binaries such as Chrome/Chromium",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
